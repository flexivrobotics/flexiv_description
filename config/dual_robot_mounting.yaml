# Dual-arm mounting configuration.
#
# Base pose of each arm relative to the shared root (world / torso) frame.
#   position x/y/z : metres
#   orientation rx/ry/rz : degrees (converted to radians by the xacro)
#
# The difference between the left and right `position` blocks is the inter-arm
# distance/transform. Values below are placeholders for a symmetric front-facing
# dual-arm layout — adjust per the actual product mounting.
positions:
  left:
    x: 0.0
    y: 0.2
    z: 0.0
    rx: 0.0
    ry: 0.0
    rz: 0.0
  right:
    x: 0.0
    y: -0.2
    z: 0.0
    rx: 0.0
    ry: 0.0
    rz: 0.0
